# Deploys the Supabase edge functions whenever they change on main, or by hand
# (Actions → "Deploy Supabase functions" → Run workflow, which works on a phone).
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN, a personal access token
# from https://supabase.com/dashboard/account/tokens
# (GitHub: Settings → Secrets and variables → Actions → New repository secret).
#
# The functions' own secrets (OPENAI_API_KEY, limits…) stay in Supabase and
# aren't touched by deploying.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: keuzvngspauddmkhtndy
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the top of this file)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Signed-in users only: keeps Supabase's JWT check on.
      - name: Deploy recipe-import
        run: supabase functions deploy recipe-import --project-ref "$PROJECT_REF" --use-api

      - name: Deploy image-proxy
        run: supabase functions deploy image-proxy --project-ref "$PROJECT_REF" --use-api

      # Opened by people who aren't signed in (share links): no JWT check;
      # the function checks sign-in itself for saving.
      - name: Deploy shared-recipe
        run: supabase functions deploy shared-recipe --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
